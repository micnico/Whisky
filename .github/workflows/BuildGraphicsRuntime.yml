name: Build Graphics Runtime Candidate

on:
  workflow_dispatch:
    inputs:
      architecture:
        description: Runtime host architecture
        required: true
        default: arm64
        type: choice
        options:
          - arm64
          - x86_64
      wine_tag:
        description: Official stable Wine tag
        required: true
        default: wine-11.0
        type: string
      wine_revision:
        description: Full Wine commit expected for the tag
        required: true
        default: db11d0fe6a169c457e23d007e20404643d067aa8
        type: string
      dxvk_tag:
        description: DXVK stable tag
        required: true
        default: v3.0.1
        type: string
      dxvk_revision:
        description: Full DXVK commit expected for the tag
        required: true
        default: c850747f1df24180ce97b7a9094603f39da1251d
        type: string
      moltenvk_tag:
        description: MoltenVK stable tag
        required: true
        default: v1.4.1
        type: string
      moltenvk_revision:
        description: Full MoltenVK commit expected for the tag
        required: true
        default: db445ff2042d9ce348c439ad8451112f354b8d2a
        type: string
      build_candidate:
        description: Build Wine after preflight (disabled by default)
        required: true
        default: false
        type: boolean
      source_artifact_run_id:
        description: Existing Actions run ID whose build artifact should be verified without rebuilding Wine
        required: false
        default: ''
        type: string
      source_artifact_signed:
        description: Whether the existing artifact was signed with Developer ID Application
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  contents: read
  attestations: write
  id-token: write

jobs:
  preflight:
    runs-on: ${{ inputs.architecture == 'x86_64' && 'macos-15-intel' || 'macos-14' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Confirm requested runner architecture
        run: test "$(uname -m)" = "${{ inputs.architecture }}"
      - name: Validate pinned revisions
        run: |
          set -euo pipefail
          for revision in '${{ inputs.wine_revision }}' '${{ inputs.dxvk_revision }}' '${{ inputs.moltenvk_revision }}'; do
            [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          done
          source_run_id='${{ inputs.source_artifact_run_id }}'
          [[ -z "$source_run_id" || "$source_run_id" =~ ^[0-9]+$ ]]
      - name: Install runtime dependency formulas
        run: brew install freetype gnutls sdl2
      - name: Verify bundleable Wine runtime dependencies
        run: scripts/verify-wine-runtime-dependencies.sh --architecture "${{ inputs.architecture }}"
  build:
    if: ${{ inputs.build_candidate && inputs.source_artifact_run_id == '' }}
    needs: preflight
    runs-on: ${{ inputs.architecture == 'x86_64' && 'macos-15-intel' || 'macos-14' }}
    timeout-minutes: 180
    outputs:
      runtime_signed: ${{ steps.runtime_metadata.outputs.runtime_signed }}
    steps:
      - uses: actions/checkout@v4
      - name: Confirm requested runner architecture
        run: test "$(uname -m)" = "${{ inputs.architecture }}"
      - name: Prepare optional Developer ID signing
        env:
          RUNTIME_SIGNING_P12_BASE64: ${{ secrets.WHISKY_RUNTIME_SIGNING_P12_BASE64 }}
          RUNTIME_SIGNING_P12_PASSWORD: ${{ secrets.WHISKY_RUNTIME_SIGNING_P12_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$RUNTIME_SIGNING_P12_BASE64" || -z "$RUNTIME_SIGNING_P12_PASSWORD" ]]; then
            echo "RUNTIME_SIGNED=false" >> "$GITHUB_ENV"
            exit 0
          fi
          keychain_path="$RUNNER_TEMP/runtime-signing.keychain-db"
          certificate_path="$RUNNER_TEMP/runtime-signing.p12"
          keychain_password="$(uuidgen)"
          printf '%s' "$RUNTIME_SIGNING_P12_BASE64" | base64 -D > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -k "$keychain_path" -P "$RUNTIME_SIGNING_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          identity="$(security find-identity -v -p codesigning "$keychain_path" | sed -n 's/.*"\(Developer ID Application: [^"]*\)".*/\1/p' | head -n 1)"
          test -n "$identity"
          echo "RUNTIME_CODE_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "RUNTIME_SIGNED=true" >> "$GITHUB_ENV"
      - name: Install build dependencies
        run: >-
          brew install bison llvm lld meson ninja mingw-w64 cmake glslang
          vulkan-headers vulkan-loader freetype gnutls sdl2
      - name: Build candidate
        env:
          WINE_TAG: ${{ inputs.wine_tag }}
          DXVK_TAG: ${{ inputs.dxvk_tag }}
          MOLTENVK_TAG: ${{ inputs.moltenvk_tag }}
        run: |
          runtime_id="$WINE_TAG-dxvk-moltenvk-${{ inputs.architecture }}"
          signing_args=()
          if [[ -n "${RUNTIME_CODE_SIGN_IDENTITY:-}" ]]; then
            signing_args+=(--code-sign-identity "$RUNTIME_CODE_SIGN_IDENTITY")
          fi
          scripts/build-wine-runtime.sh \
            --wine-tag "$WINE_TAG" \
            --wine-revision "${{ inputs.wine_revision }}" \
            --dxvk-tag "$DXVK_TAG" \
            --dxvk-revision "${{ inputs.dxvk_revision }}" \
            --moltenvk-tag "$MOLTENVK_TAG" \
            --moltenvk-revision "${{ inputs.moltenvk_revision }}" \
            --runtime-id "$runtime_id" \
            --architecture "${{ inputs.architecture }}" \
            --archive-url "https://example.invalid/$runtime_id.tar.gz" \
            --workdir "$RUNNER_TEMP/runtime-build" \
            --output "$RUNNER_TEMP/runtime-output" \
            --jobs 3 \
            "${signing_args[@]}"
      - id: runtime_metadata
        name: Record candidate signing state
        run: echo "runtime_signed=${RUNTIME_SIGNED:-false}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: wine-graphics-runtime-build-output
          path: |
            ${{ runner.temp }}/runtime-output
            ${{ runner.temp }}/runtime-build/*.log
          retention-days: 14
  verify:
    if: ${{ always() && needs.preflight.result == 'success' && (inputs.source_artifact_run_id != '' || needs.build.result == 'success') }}
    needs: [preflight, build]
    runs-on: ${{ inputs.architecture == 'x86_64' && 'macos-15-intel' || 'macos-14' }}
    timeout-minutes: 30
    env:
      RUNTIME_SIGNED: ${{ inputs.source_artifact_run_id != '' && inputs.source_artifact_signed || needs.build.outputs.runtime_signed || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: wine-graphics-runtime-build-output
          path: ${{ runner.temp }}/runtime-build-output
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_artifact_run_id || github.run_id }}
      - name: Restore candidate output path
        env:
          WINE_TAG: ${{ inputs.wine_tag }}
          SOURCE_ARTIFACT_RUN_ID: ${{ inputs.source_artifact_run_id || github.run_id }}
        run: |
          set -euo pipefail
          runtime_id="$WINE_TAG-dxvk-moltenvk-${{ inputs.architecture }}"
          archive_path="$(find "$RUNNER_TEMP/runtime-build-output" -type f -name "$runtime_id.tar.gz" -print -quit)"
          test -n "$archive_path"
          mkdir -p "$RUNNER_TEMP/runtime-output"
          cp -R "$(dirname "$archive_path")/." "$RUNNER_TEMP/runtime-output/"
          printf '%s\n' "$SOURCE_ARTIFACT_RUN_ID" > "$RUNNER_TEMP/runtime-output/source-artifact-run-id.txt"
      - name: Verify archive
        env:
          WINE_TAG: ${{ inputs.wine_tag }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/runtime-output"
          runtime_id="$WINE_TAG-dxvk-moltenvk-${{ inputs.architecture }}"
          if [[ "$RUNTIME_SIGNED" == "true" ]]; then
            require_developer_id=--require-developer-id
          else
            require_developer_id=
          fi
          test -s "$runtime_id.tar.gz"
          expected="$(awk '{print $1}' "$runtime_id.tar.gz.sha256")"
          actual="$(openssl dgst -sha256 "$runtime_id.tar.gz" | awk '{print $NF}')"
          test "$expected" = "$actual"
          if [[ -n "$require_developer_id" ]]; then
            "$GITHUB_WORKSPACE/scripts/verify-graphics-runtime.sh" \
              --archive "$runtime_id.tar.gz" \
              --workdir "$RUNNER_TEMP/runtime-verify" \
              --architecture "${{ inputs.architecture }}" \
              "$require_developer_id"
          else
            "$GITHUB_WORKSPACE/scripts/verify-graphics-runtime.sh" \
              --archive "$runtime_id.tar.gz" \
              --workdir "$RUNNER_TEMP/runtime-verify" \
              --architecture "${{ inputs.architecture }}"
          fi
      - name: Install smoke-test compiler
        if: ${{ env.RUNTIME_SIGNED == 'true' || inputs.architecture == 'x86_64' }}
        run: brew install mingw-w64
      - name: Smoke test Wine and WoW64
        if: ${{ env.RUNTIME_SIGNED == 'true' || inputs.architecture == 'x86_64' }}
        timeout-minutes: 4
        env:
          WINE_TAG: ${{ inputs.wine_tag }}
        run: |
          set -euo pipefail
          runtime_id="$WINE_TAG-dxvk-moltenvk-${{ inputs.architecture }}"
          smoke_dir="$RUNNER_TEMP/runtime-smoke"
          mkdir "$smoke_dir"
          tar -C "$smoke_dir" -xzf "$RUNNER_TEMP/runtime-output/$runtime_id.tar.gz"
          wine="$smoke_dir/Libraries/Wine/bin/wine64"
          {
            set -x
            test "$("$wine" --version)" = "$WINE_TAG"
            i686-w64-mingw32-gcc "$GITHUB_WORKSPACE/scripts/fixtures/smoke-win32.c" \
              -o "$smoke_dir/smoke-win32.exe"
            x86_64-w64-mingw32-gcc "$GITHUB_WORKSPACE/scripts/fixtures/smoke-d3d11.c" \
              -o "$smoke_dir/smoke-d3d11.exe" -ld3d11 -ldxgi
            export WINEPREFIX="$smoke_dir/prefix"
            export VK_ICD_FILENAMES="$smoke_dir/Libraries/Vulkan/MoltenVK_icd.json"
            export DYLD_FALLBACK_LIBRARY_PATH="$smoke_dir/Libraries/Vulkan:$smoke_dir/Libraries/Wine/lib${DYLD_FALLBACK_LIBRARY_PATH:+:$DYLD_FALLBACK_LIBRARY_PATH}"
            # Wine's first-prefix wine.inf registers mscoree.dll. Without a bundled
            # Mono MSI this synchronously opens the interactive downloader, which
            # cannot complete on a CI runner. Keep this override scoped to bootstrap.
            WINEDLLOVERRIDES="mscoree,mshtml=" "$wine" wineboot -u
            "$wine" "$smoke_dir/smoke-win32.exe"
            cp "$smoke_dir/Libraries/DXVK/x64/"*.dll "$WINEPREFIX/drive_c/windows/system32/"
            cp "$smoke_dir/Libraries/DXVK/x32/"*.dll "$WINEPREFIX/drive_c/windows/syswow64/"
            WINEDLLOVERRIDES="d3d11,dxgi=n,b" "$wine" "$smoke_dir/smoke-d3d11.exe"
          } 2>&1 | tee "$RUNNER_TEMP/wow64-smoke.log"
      - name: Record skipped executable smoke test
        if: ${{ env.RUNTIME_SIGNED != 'true' && inputs.architecture == 'arm64' }}
        run: >-
          printf '%s\n'
          'SKIPPED: Native arm64 Wine/WoW64 execution requires a configured Developer ID Application signing certificate.'
          > "$RUNNER_TEMP/wow64-smoke.log"
      - name: Attest candidate artifacts
        uses: actions/attest@v4
        with:
          subject-path: '${{ runner.temp }}/runtime-output/*'
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: wine-graphics-runtime-candidate
          path: |
            ${{ runner.temp }}/runtime-output
            ${{ runner.temp }}/wow64-smoke.log
          retention-days: 14
